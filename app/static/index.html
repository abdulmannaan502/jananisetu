<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JananiSetu | Care Operations</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#152b37;background:#f3f7f6}*{box-sizing:border-box}body{margin:0}header{padding:20px 32px;background:#163d49;color:white;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}header h1{font-size:25px;margin:0}header small{color:#b1e4dc}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 76px)}aside{background:white;padding:22px 12px;border-right:1px solid #dce5e4}.nav{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:12px;font-size:15px;cursor:pointer;color:#34505c}.nav.active,.nav:hover{background:#dceee8;color:#145c52}main{padding:28px;max-width:1400px;width:100%;margin:auto}.panel{background:white;border:1px solid #e0e8e7;padding:20px;border-radius:12px;margin:12px 0;box-shadow:0 2px 14px #132d3010}h2{margin:0 0 8px}h3{margin:0 0 10px;font-size:16px}p{color:#536971}label{display:block;font-size:12px;font-weight:650;margin:9px 0 4px}input,select,textarea{border:1px solid #cad8d7;border-radius:7px;padding:10px;width:100%;font:inherit;background:white}textarea{min-height:60px}button.primary{background:#146f66;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer;margin-top:12px}button.secondary{background:#e9f4f1;color:#125e55;border:0;padding:8px 11px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}.flex{display:flex;gap:14px;flex-wrap:wrap}.flex>*{flex:1;min-width:200px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.stat{background:white;border-radius:12px;padding:17px;border:1px solid #e0e8e7}.stat b{font-size:30px;color:#146f66;display:block;margin-top:8px}.pill{font-size:12px;background:#e5f1ef;border-radius:20px;padding:4px 9px;display:inline-block}.muted{color:#63767a}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e5eeee;padding:11px 8px;vertical-align:top}th{color:#668084}code{font-size:12px}.notice{padding:11px 15px;background:#fff5dd;border:1px solid #eddbb7;border-radius:9px;font-size:13px}#alert{padding:12px;border-radius:8px;display:none;margin-bottom:14px}.good{background:#dcf4e6;color:#115335}.bad{background:#ffebeb;color:#9a2424}@media(max-width:750px){.layout{display:block}aside{display:flex;overflow:auto;padding:8px}.nav{white-space:nowrap;width:auto}main{padding:15px}}
</style></head><body><header><div><h1>✦ JananiSetu <small>Care Operations</small></h1><small>Maternal care coordination · local demonstration</small></div><div><label for="staff" style="color:white">Active staff account</label><select id="staff" style="min-width:200px"></select></div></header><div class="layout"><aside id="menu"></aside><main><div class="notice">DEMO MODE — synthetic patient records only. WhatsApp messages are simulated; no clinical advice, risk scoring, real payments or transport booking.</div><div id="alert"></div><div id="view"></div></main></div><script>
const pages=['Dashboard','Mothers','Care Plans','Documents & OCR','Follow-up Tasks','Messages','Transport','Expenses','Audit'];let current='Dashboard',staffId=localStorage.getItem('janani_staff')||'',mothers=[];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fetcher=async(url,method='GET',body)=>{let opt={method,headers:{'X-Staff-ID':staffId}};if(body instanceof FormData){opt.body=body}else if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}const res=await fetch(url,opt),txt=await res.text();let data;try{data=JSON.parse(txt)}catch{data=txt}if(!res.ok)throw Error(typeof data?.detail==='string'?data.detail:txt);return data};function message(t,error=false){const a=$('alert');a.className=error?'bad':'good';a.style.display='block';a.textContent=t;setTimeout(()=>a.style.display='none',6500)}function formHandler(id,fn){setTimeout(()=>{$(id).onsubmit=async e=>{e.preventDefault();try{await fn(Object.fromEntries(new FormData(e.target)));message('Saved successfully');await render()}catch(err){message(err.message,true)}}},0)}function table(items,cols){if(!items.length)return '<p class="muted">No records yet.</p>';return `<div class="tablewrap"><table><thead><tr>${cols.map(([k,t])=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${items.map(a=>`<tr>${cols.map(([k])=>`<td>${esc(a[k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}function choices(arr,label='Mother'){return `<label>${label}</label><select name="mother_id" required>${arr.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} — ${esc(a.id)}</option>`).join('')}</select>`}async function start(){let s=await fetcher('/api/staff');if(!s.length){for(const [name,role] of [['Demo Administrator','admin'],['Demo Doctor','doctor'],['Demo Nurse','nurse'],['Demo ASHA','asha']])await fetcher('/api/staff','POST',{name,role});s=await fetcher('/api/staff')}staffId=s.some(a=>a.id===staffId)?staffId:s[0].id;localStorage.setItem('janani_staff',staffId);$('staff').innerHTML=s.map(a=>`<option value="${a.id}">${esc(a.name)} (${a.role})</option>`).join('');$('staff').value=staffId;$('staff').onchange=()=>{staffId=$('staff').value;localStorage.setItem('janani_staff',staffId);render()};$('menu').innerHTML=pages.map(p=>`<button class="nav" data-page="${p}">${p}</button>`).join('');document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{current=n.dataset.page;render()});render()}
async function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===current));try{mothers=await fetcher('/api/mothers');let content='';if(current==='Dashboard'){let a=await fetcher('/api/analytics');content=`<h2>Operations overview</h2><p>Live figures from persistent application records.</p><div class="stats">${Object.entries(a).map(([k,v])=>`<div class="stat">${k.replaceAll('_',' ')}<b>${v}</b></div>`).join('')}</div><div class="panel"><h3>Care team workflow</h3><p>Register mother → record consent → scan ANC card → confirm transcription → doctor enters appointment → simulate reminder → track replies and follow-up → coordinate transport → review costs.</p></div>`}
if(current==='Mothers'){content=`<h2>Mothers</h2><div class="flex"><section class="panel"><h3>Register synthetic patient</h3><form id="motherForm"><label>Name</label><input required name="name" placeholder="Synthetic patient name"><label>Phone (demo only)</label><input required name="phone" placeholder="0000000000"><label>Language</label><select name="language"><option value="te">Telugu</option><option value="hi">Hindi</option><option value="en">English</option></select><label><input type="checkbox" name="consent" style="width:auto"> Communication consent recorded</label><button class="primary">Register</button></form></section><section class="panel"><h3>Registered mothers</h3>${table(mothers,[['name','Name'],['phone','Phone'],['language','Language'],['consent','Consent'],['id','ID']])}</section></div>`;formHandler('motherForm',v=>fetcher('/api/mothers','POST',{...v,consent:!!v.consent}))}
if(current==='Care Plans'){content=`<h2>Doctor-approved care plans</h2><p>Only the doctor role can set or change an appointment. Each change versions the plan and supersedes earlier ones.</p><div class="panel"><form id="planForm">${choices(mothers)}<label>Next visit</label><input name="visit_date" type="date" required><label>Doctor's administrative instruction</label><textarea name="note"></textarea><button class="primary">Approve new care plan</button></form></div><div class="panel"><h3>Plans for selected mother</h3><select id="planMother">${mothers.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div id="plansList"></div></div>`;formHandler('planForm',v=>fetcher('/api/mothers/'+v.mother_id+'/plans','POST',{visit_date:v.visit_date,note:v.note}));setTimeout(()=>{let x=$('planMother');async function load(){if(!x.value)return;$('plansList').innerHTML=table(await fetcher('/api/mothers/'+x.value+'/plans'),[['visit_date','Visit'],['note','Note'],['version','Version'],['active','Active'],['approved_by','Doctor ID']])}x.onchange=load;load()},0)}
if(current==='Documents & OCR'){content=`<h2>ANC card digitisation</h2><p>OCR text is always unconfirmed until a staff member reviews it. Do not upload real patient data.</p><div class="panel"><form id="docForm">${choices(mothers)}<label>ANC card image (JPG, PNG, WEBP; ≤5MB)</label><input type="file" name="file" accept="image/*" required><button class="primary">Upload and OCR</button></form></div><div class="panel"><h3>Review document</h3><select id="docMother">${mothers.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div id="docList"></div></div>`;setTimeout(()=>{$('docForm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),mid=fd.get('mother_id');fd.delete('mother_id');try{await fetcher('/api/mothers/'+mid+'/documents','POST',fd);message('OCR finished; staff verification required');render()}catch(err){message(err.message,true)}};const x=$('docMother');async function load(){if(!x.value)return;let docs=await fetcher('/api/mothers/'+x.value+'/documents');$('docList').innerHTML=docs.map(d=>`<div class="panel"><b>${esc(d.filename)}</b> · <span class="pill">${d.confirmed?'Confirmed':'UNCONFIRMED'}</span><textarea id="doc_${d.id}">${esc(d.extracted_text)}</textarea><button class="secondary" data-did="${d.id}">Confirm corrected transcription</button></div>`).join('')||'<p>No scans</p>';document.querySelectorAll('[data-did]').forEach(b=>b.onclick=async()=>{try{await fetcher('/api/documents/'+b.dataset.did+'/confirm','PATCH',{corrected_text:$('doc_'+b.dataset.did).value});message('Staff confirmation recorded');load()}catch(e){message(e.message,true)}})}x.onchange=load;load()},0)}
if(current==='Follow-up Tasks'){let list=await fetcher('/api/tasks');content=`<h2>Follow-up work queue</h2><div class="panel"><h3>Create follow-up task</h3><form id="taskForm">${choices(mothers)}<label>Category</label><select name="category"><option>contact_attempt</option><option>missed_visit</option><option>patient_reply</option><option>transport</option><option>other</option></select><label>Assigned staff ID (optional)</label><input name="assigned_to"><label>Instructions</label><textarea name="detail"></textarea><button class="primary">Create task</button></form></div><div class="panel"><h3>Current tasks</h3>${table(list,[['mother_id','Mother ID'],['category','Category'],['status','Status'],['assigned_to','Owner'],['detail','Detail'],['id','ID']])}<form id="taskStatus"><label>Task</label><select name="id">${list.map(t=>`<option value="${t.id}">${t.id} - ${esc(t.category)} (${esc(t.status)})</option>`).join('')}</select><label>New status</label><select name="status"><option>open</option><option>in_progress</option><option>resolved</option><option>cancelled</option></select><button class="primary">Update status</button></form></div>`;formHandler('taskForm',v=>fetcher('/api/tasks','POST',v));formHandler('taskStatus',v=>fetcher('/api/tasks/'+v.id,'PATCH',{status:v.status}))}
if(current==='Messages'){let list=await fetcher('/api/messages');content=`<h2>Communication hub</h2><p>Outgoing reminders use the local simulator; inbound text below is a manually triggered demo event and appears unchanged in the staff queue.</p><div class="flex"><div class="panel"><h3>Simulate appointment reminder</h3><form id="reminderForm">${choices(mothers)}<button class="primary">Simulate send</button></form></div><div class="panel"><h3>Simulate inbound patient reply</h3><form id="replyForm">${choices(mothers)}<label>Verbatim reply</label><textarea name="body" required></textarea><button class="primary">Receive reply</button></form></div></div><div class="panel"><h3>Message log</h3>${table(list,[['mother_id','Mother ID'],['direction','Direction'],['body','Verbatim text'],['status','Status'],['provider','Channel']])}</div>`;formHandler('reminderForm',v=>fetcher('/api/reminders/send','POST',v));formHandler('replyForm',v=>fetcher('/api/messages/reply','POST',v))}
if(current==='Transport'){let list=await fetcher('/api/transport');content=`<h2>Transport coordination</h2><p>Records requests only; does not book or dispatch ambulances.</p><div class="panel"><form id="transportForm">${choices(mothers)}<label>Required date</label><input type="date" name="date" required><label>Origin</label><input name="from_location" required><label>Destination</label><input name="destination" required><label>Approved transport partner (optional)</label><input name="partner"><button class="primary">Record request</button></form></div><div class="panel">${table(list,[['mother_id','Mother ID'],['date','Date'],['from_location','Origin'],['destination','Destination'],['status','Status'],['partner','Partner']])}<form id="transStatus"><label>Request</label><select name="id">${list.map(t=>`<option value="${t.id}">${t.id}</option>`).join('')}</select><label>New status</label><select name="status"><option>requested</option><option>assigned</option><option>completed</option><option>cancelled</option></select><button class="primary">Update request</button></form></div>`;formHandler('transportForm',v=>fetcher('/api/transport','POST',v));formHandler('transStatus',v=>fetcher('/api/transport/'+v.id,'PATCH',{status:v.status}))}
if(current==='Expenses'){try{let list=await fetcher('/api/expenses');content=`<h2>Programme expenses</h2><p>Administrative expenditure records, not government reimbursement claims or payments.</p><div class="panel"><form id="expenseForm"><label>Category</label><select name="category"><option>salary</option><option>travel</option><option>transport</option><option>diagnostics</option><option>technology</option><option>other</option></select><label>Amount (₹)</label><input name="amount_rupees" type="number" min="1" required><label>Description</label><textarea name="description"></textarea><button class="primary">Record expense</button></form></div><div class="panel">${table(list,[['category','Category'],['amount_paise','Amount (paise)'],['description','Description'],['approved','Approved'],['id','ID']])}<form id="expenseApproval"><label>Expense</label><select name="id">${list.map(e=>`<option value="${e.id}">${e.id}</option>`).join('')}</select><label>Decision</label><select name="approved"><option value="true">Approve</option><option value="false">Revoke approval</option></select><button class="primary">Save decision</button></form></div>`;formHandler('expenseForm',v=>fetcher('/api/expenses','POST',{...v,amount_rupees:Number(v.amount_rupees)}));formHandler('expenseApproval',v=>fetcher('/api/expenses/'+v.id,'PATCH',{approved:v.approved==='true'}))}catch(e){content=`<h2>Expenses</h2><div class="notice">Admin role required. ${esc(e.message)}</div>`}}
if(current==='Audit'){try{let list=await fetcher('/api/events');content=`<h2>Audit history</h2><div class="panel">${table(list,[['occurred','When'],['actor','Actor ID'],['action','Action'],['entity','Entity'],['entity_id','Record ID'],['detail','Details']])}</div>`}catch(e){content=`<div class="notice">Admin or doctor role required. ${esc(e.message)}</div>`}}
$('view').innerHTML=content}catch(e){$('view').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
start().catch(e=>message(e.message,true));
</script></body></html>
